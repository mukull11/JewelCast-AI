project:
  name: JewelCast AI
  version: 0.1.0
  seed: 42

paths:
  data_raw: data/raw
  data_processed: data/processed
  data_synthetic: data/synthetic
  data_external: data/external
  models: models
  reports: reports
  logs: logs

data:
  # Active mode for the application: synthetic | uci | m5
  mode: synthetic

  uci:
    excel_filename: online_retail_II.xlsx
    sheets:
      - "Year 2009-2010"
      - "Year 2010-2011"
    currency: GBP
    country_note: "United Kingdom retail transactions. Not Indian retail data."
    non_product_codes:
      - POST
      - DOT
      - M
      - D
      - C2
      - BANK CHARGES
      - AMAZONFEE
      - PADS
      - CRUK
      - B
      - S
      - GIFT
      - TEST001
      - TEST002
      - TEST003
    jewellery_rules:
      Earrings:
        - earring
        - ear rings
        - stud earrings
      Necklaces:
        - necklace
        - necklet
        - choker
      Rings:
        - ring
      Bracelets:
        - bracelet
      Bangles:
        - bangle
      Anklets:
        - anklet
      Pendants:
        - pendant
      Jewellery Sets:
        - jewellery set
        - jewelry set
        - necklace and earring
        - earring and necklace
      Other Jewellery:
        - brooch
        - charm
        - cufflink
        - tiara
        - jewellery
        - jewelry
    jewellery_exclusions:
      - key ring
      - keyring
      - napkin ring
      - curtain ring
      - ring binder
      - ring holder
      - spring
      - earring card
      - earring stand
      - jewellery box
      - jewelry box
      - jewellery stand
      - jewelry stand
      - jewellery roll
      - jewelry roll
      - jewellery bag
      - jewelry bag
      - jewellery case
      - jewelry case

  m5:
    sales_file: sales_train_validation.csv
    calendar_file: calendar.csv
    prices_file: sell_prices.csv
    subset:
      n_items: 30
      n_stores: 3
      max_days: 730
      stratify_by_category: true
      stratify_by_state: true
    note: "Walmart M5 benchmark. Not jewellery data and not Voylla data."

  synthetic:
    n_skus: 300
    start_date: "2023-01-01"
    end_date: "2024-12-31"
    seed: 42
    cold_start_fraction: 0.12
    initial_stock_days_min: 18
    initial_stock_days_max: 55
    lead_time_days_min: 7
    lead_time_days_max: 30
    promotion_probability: 0.06
    max_discount_percentage: 40
    target_service_level: 0.95

